<svg width="128" height="128" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#151820"/>
    <stop offset="100%" stop-color="#0A0B0F"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0" r="1" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="rgba(59,130,246,0.18)"/>
    <stop offset="65%" stop-color="rgba(59,130,246,0)"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.45)" flood-opacity="1"/>
  </filter>
</defs>
<!-- Base with gradient and shadow -->
<rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
<rect width="32" height="32" rx="7.5" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
<rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="0.6"/>
<!-- Q shape - premium geometric -->
<g filter="url(#shadow)">
  <!-- Outer Q circle -->
  <circle cx="15.8" cy="14.2" r="7.1" stroke="rgba(255,255,255,0.96)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Q tail - integrated diagonal with rounded end -->
  <path d="M19.9 18.4 L23.1 21.8" stroke="rgba(255,255,255,0.96)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Play triangle inside Q - precise centering -->
  <path d="M13.6 10.6 L19.2 14.2 L13.6 17.8 Z" fill="rgba(255,255,255,0.96)" stroke="rgba(255,255,255,0.96)" stroke-width="0.4" stroke-linejoin="round"/>
</g>
<!-- Accent dot - top right hint of quality/active -->
<circle cx="24.2" cy="7.8" r="1.6" fill="#3B82F6" stroke="rgba(255,255,255,0.9)" stroke-width="0.4"/>
<circle cx="24.2" cy="7.8" r="3.2" fill="rgba(59,130,246,0.18)" opacity="0.6"/>
</svg>