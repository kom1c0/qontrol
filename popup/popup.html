<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="extensionName">YouTube Quality Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <img src="../icons/icon.svg" width="28" height="28" alt="" aria-hidden="true" style="width:28px;height:28px;border-radius:8px;display:block;"/>
        </div>
        <div class="brand">
          <span class="brand-name">YT QUALITY</span>
          <span class="brand-sub">CONTROLLER</span>
        </div>
      </div>
      <div class="header-right">
        <div class="status-pill" id="status-pill" data-state="standby">
          <span class="pill-dot" id="status-indicator"></span>
          <span class="pill-text" id="status-text" data-i18n="statusInactive">Standby</span>
        </div>
      </div>
    </header>

    <div class="divider"></div>

    <!-- Preferred Quality -->
    <section class="section">
      <label class="section-label" for="quality-trigger" data-i18n="preferredQualityLabel">Preferred Quality</label>
      
      <!-- Hidden native select (preserves existing JS logic) -->
      <select id="quality-select" class="native-select" aria-hidden="true" tabindex="-1">
        <option value="144p">144p</option>
        <option value="240p">240p</option>
        <option value="360p">360p</option>
        <option value="480p">480p</option>
        <option value="720p">720p</option>
        <option value="1080p" selected>1080p</option>
        <option value="1440p">1440p</option>
        <option value="2160p">2160p</option>
        <option value="4320p">4320p</option>
      </select>

      <!-- Custom premium selector -->
      <button class="quality-trigger" id="quality-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select preferred quality">
        <span class="quality-main">
          <span class="quality-value" id="quality-value">1080p</span>
          <span class="quality-label" id="quality-label">Full HD</span>
        </span>
        <span class="quality-meta">
          <span class="quality-badge" id="quality-badge">HD</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3.5 5.25L7 8.75L10.5 5.25" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <div class="quality-popover" id="quality-popover" role="listbox" aria-label="Quality options">
        <!-- Options injected by JS -->
      </div>
    </section>

    <!-- Status Card -->
    <section class="status-card" id="status-card" data-state="standby">
      <div class="status-card-top">
        <span class="card-label">QUALITY CONTROL</span>
        <span class="card-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="1.5" y="2.5" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.1"/>
            <path d="M5 5.5L7 7L9 5.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
      <div class="status-card-main">
        <span class="status-card-dot"></span>
        <span class="status-card-value" id="status-card-value">1080p</span>
      </div>
      <div class="status-card-desc" id="current-quality">Currently enforced</div>
      <button class="reset-link" id="reset-override" data-i18n="resetOverrideButton" style="display:none">Reset Manual Override</button>
    </section>

    <!-- Language -->
    <section class="section section-compact">
      <label class="section-label" for="lang-select" data-i18n="languageLabel">Language</label>
      <div class="select-wrapper">
        <select id="lang-select" aria-label="Select language">
          <option value="en">English</option>
          <option value="fa">فارسی</option>
        </select>
      </div>
    </section>

    <div class="divider divider-light"></div>

    <footer class="footer">
      <span class="footer-left">YouTube Quality Controller</span>
      <span class="footer-version">v1.7.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
